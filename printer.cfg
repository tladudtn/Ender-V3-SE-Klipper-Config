# Pin Mappings for Stock 2023 Creality Ender 3 V3 SE
#
# To use this configuration:
# 1. During "make menuconfig", select:
#    - STM32F103 with a "28KiB bootloader"
#    - Serial communication on USART1 (PA10/PA9)
#
# 2. For a direct serial connection:
#    - In "make menuconfig", select:
#      - "Enable extra low-level configuration options"
#      - Serial communication on USART3 (PB11/PB10)
#    - This is accessible via the 10-pin IDC cable used for the LCD module:
#      - Pin 3: Tx
#      - Pin 4: Rx
#      - Pin 9: GND
#      - Pin 10: VCC
#
# 3. Build the firmware by running:
#    - make
#
# 4. Flash the firmware:
#    - Copy "klipper/out/klipper.bin" to an SD card.
#    - Insert the SD card into the printer and power it on.
#    - Ensure the firmware filename ends in ".bin" and is different from the last flashed filename.
#
# For further details, refer to https://www.klipper3d.org/Config_Reference.html.

#####################################################################
# Include the relevant configuration depending on what you are using.
#####################################################################

[include fluidd.cfg]
# [include mainsail.cfg]

[exclude_object]

#[include KAMP_Settings.cfg]

[include macros.cfg]
[include ds18b20/*.cfg]
[include panda_breath/*.cfg]
#[include adxl.cfg]

#####################################################################
#   BTT Eddy DUO (USB mode) - bed probe + Z endstop
#   USB mode = Eddy DUO's own RP2040 MCU + coil thermistor (same as Eddy USB)
#   For Eddy Coil (I2C to a toolboard): remove [mcu eddy],
#   [temperature_sensor btt_eddy_mcu] and [temperature_probe btt_eddy],
#   and set i2c_mcu / i2c_bus to the toolboard.
#   Calibration order: run EDDY_CALIBRATE (prints the steps, macros.cfg)
#####################################################################

# DUO USB only: Eddy DUO RP2040 MCU
[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404109B8A1C-if00
restart_method: command


# DUO USB only: Eddy DUO MCU temperature
[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
descend_z: 3.5
sensor_type: ldc1612

# DUO USB: LDC1612 on Eddy DUO's own MCU (Eddy Coil: toolboard MCU / I2C bus)
i2c_mcu: eddy
i2c_bus: i2c0f
# Coil center relative to nozzle
x_offset: -36.5
y_offset: -16

# DUO USB only: coil thermistor for drift compensation (EDDY_CALIBRATE_TEMP)
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2


[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 36.0
shaper_type_y: ei
shaper_freq_y: 47

[mcu]
#####################################################################
# Obtain definition by "ls -l /dev/serial/by-id/"
#####################################################################
#serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command


[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: cartesian
max_velocity: 125
max_accel: 1250
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 100
max_z_accel: 500

#####################################################################
#   X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -11
position_min: -11
position_max: 220
homing_speed: 60

## max : 220
## stop -8
[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -16.5
position_min: -16.5
position_max: 223
homing_speed: 60

[tmc2209 stepper_y]
uart_pin: PB13
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
# Z endstop = Eddy DUO (no Z switch)
endstop_pin: probe:z_virtual_endstop
position_min: -3
# 210 = toolhead limit (enclosure ceiling), slicer max print height 200
# (10mm headroom for z-hop / PRINT_END lift)
position_max: 210
homing_speed: 5
second_homing_speed: 1
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.663
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 500

# INFO : Flow Ratio : 1

## Kexcelled PLA Matte
#pressure_advance: 0.08
#pressure_advance_smooth_time: 0.01

## JAYO PETG
pressure_advance: 0.16
pressure_advance_smooth_time: 0.04

heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
# Tuned for stock hardware with a target of 200 degrees Celsius.
#pid_Kp: 27.142
#pid_Ki: 1.371
#pid_Kd: 134.351
min_temp: 0
max_temp: 260

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
# Tuned for stock hardware with a target of 70 degrees Celsius.
#pid_kp: 66.371
#pid_ki: 0.846
#pid_kd: 1301.702
min_temp: 0
max_temp: 100

#####################################################################
#   Bed Mesh
#####################################################################

[bed_mesh]
horizontal_move_z: 2.5
speed: 150
# Mesh bounds limited by Eddy x/y offset (coil must reach every point)
mesh_min: 20,10
mesh_max: 175,204
probe_count: 10, 10
algorithm: bicubic


#####################################################################
#   Fan Control
#####################################################################

[heater_fan hotend_fan]
pin: PC1
fan_speed: 0.75

[fan]
pin: PA0

#####################################################################
#   Idle Timeout & Homing
#####################################################################

[idle_timeout]
gcode:
  OFF
timeout: 600

# Eddy DUO Z homing: safe_z_home + force_move + G28 override below
[safe_z_home]
home_xy_position: 146, 131
speed: 60
z_hop: 0
z_hop_speed: 5
[force_move]
enable_force_move: True

# Z home: lift 10mm with FORCE_MOVE first (Z position unknown, no Z switch)
[gcode_macro G28]
rename_existing: G28.1
gcode:
    G28.1 X
    G28.1 Y
    {% if 'Z' in rawparams or rawparams == '' %}
        SET_KINEMATIC_POSITION Z=0
        FORCE_MOVE STEPPER=stepper_z DISTANCE=10 VELOCITY=5  ; clearance before eddy Z-home
        G28.1 Z
        G90
        G1 Z10 F600
    {% endif %}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    G90
    G1 Z{ printer.probe.last_z_result } F300

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_runtime_offset: 0
variable_restored: False
gcode:
    SET_GCODE_OFFSET_ORIG { rawparams }

#####################################################################
#   Beeper
#####################################################################

[output_pin beeper]
pin: PB0

#####################################################################
#   G-Code features
#####################################################################

[gcode_arcs]

[exclude_object]

