# BIQU Panda Breath chamber heater (stock firmware, WebSocket)
# Requires panda_breath.py linked into ~/klipper/klippy/extras (install.sh)
[panda_breath]
host: 192.168.1.198
#port: 80

[heater_generic panda_breath]
heater_pin: panda_breath:pwm
sensor_type: panda_breath
control: watermark
max_delta: 0.5
min_temp: 15
max_temp: 80

# The chamber can plateau below target in a cold room. hysteresis 10 treats
# target-10C as reached; max_error 600 tolerates short drops (door opened).
# Heating still has to gain 1C every 360s until then.
[verify_heater panda_breath]
check_gain_time: 360
heating_gain: 1
hysteresis: 10
max_error: 600
