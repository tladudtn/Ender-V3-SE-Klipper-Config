<title>Molten Ceiling</title>
<style>
  :root {
    --void: #050505;
  }

  html, body {
    height: 100%;
    background: var(--void);
  }

  body {
    overflow: hidden;
    color: #ff2f14;
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: var(--void);
  }
</style>

<canvas id="stage"></canvas>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  let W = 0, H = 0, DPR = 1;
  let baseH = 0, edge = [], drips = [], drops = [];
  let grad = null;
  let t = 0;
  const pointer = { x: -9999, on: false };

  /* ---------- construction ---------- */

  function buildEdge() {
    const n = Math.max(20, Math.round(W / 30));
    const a = rand(0, 100), b = rand(0, 100), c = rand(0, 100);
    edge = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const shape =
        Math.sin(u * 5.3 + a) * 0.54 +
        Math.sin(u * 12.9 + b) * 0.21 +
        Math.sin(u * 23.7 + c) * 0.07;
      edge.push({
        x: u * W,
        y0: baseH * (1 + shape * 0.42) + rand(-1, 1) * baseH * 0.05,
        amp: baseH * rand(0.012, 0.045),
        ph: rand(0, Math.PI * 2),
        sp: rand(0.25, 0.7)
      });
    }
  }

  function edgeY(x) {
    const n = edge.length - 1;
    const f = clamp(x / W, 0, 1) * n;
    const i = Math.min(n - 1, Math.floor(f));
    const k = f - i;
    const p = edge[i], q = edge[i + 1];
    const py = p.y0 + Math.sin(t * p.sp + p.ph) * p.amp;
    const qy = q.y0 + Math.sin(t * q.sp + q.ph) * q.amp;
    return py + (qy - py) * k;
  }

  function newDrip(x, fat) {
    const w = fat ? rand(0.055, 0.085) * H : rand(0.020, 0.055) * H;
    return {
      x: x !== undefined ? x : rand(-0.02, 1.02) * W,
      w,
      len: fat ? H * 0.04 : rand(0, 0.05) * H,
      max: rand(0.10, 0.62) * H,
      speed: (fat ? rand(0.06, 0.10) : rand(0.010, 0.048)) * H,
      taper: rand(0.34, 0.62),
      ph: rand(0, Math.PI * 2),
      sway: rand(0.15, 0.5),
      life: 1,
      fading: false
    };
  }

  function targetDrips() {
    return clamp(Math.round(W / 52), 10, 52);
  }

  /* ---------- simulation ---------- */

  function step(dt) {
    t += dt;

    for (let i = drips.length - 1; i >= 0; i--) {
      const d = drips[i];
      let heat = 0;
      if (pointer.on) heat = clamp(1 - Math.abs(d.x - pointer.x) / (W * 0.14), 0, 1);

      if (d.fading) {
        d.len -= d.speed * 2.4 * dt;
        d.life -= dt * 0.7;
        if (d.len <= 0 || d.life <= 0) drips.splice(i, 1);
        continue;
      }

      d.len += d.speed * (1 + heat * 4.5) * dt;

      if (d.len >= d.max) {
        const tip = d.w * d.taper * 0.5;
        drops.push({
          x: d.x + Math.sin(t * d.sway + d.ph) * d.w * 0.35,
          y: edgeY(d.x) + d.len - tip,
          r: tip * 1.08,
          vy: H * 0.06
        });
        d.len *= 0.38;
        d.max = rand(0.10, 0.62) * H;
        if (Math.random() < 0.16) d.fading = true;
      }
    }

    while (drips.length < targetDrips()) drips.push(newDrip());

    for (let i = drops.length - 1; i >= 0; i--) {
      const p = drops[i];
      p.vy += H * 1.05 * dt;
      p.y += p.vy * dt;
      if (p.y - p.r > H) drops.splice(i, 1);
    }
  }

  /* ---------- drawing ---------- */

  function shapes() {
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.fillStyle = '#000';
    octx.fillRect(0, 0, W, H);
    octx.fillStyle = '#fff';

    // the sheet clinging to the top, its underside sagging
    octx.beginPath();
    octx.moveTo(-4, -4);
    octx.lineTo(W + 4, -4);
    const last = edge.length - 1;
    octx.lineTo(W + 4, edgeY(W));
    for (let i = last; i > 0; i--) {
      const p = edge[i], q = edge[i - 1];
      const py = p.y0 + Math.sin(t * p.sp + p.ph) * p.amp;
      const qy = q.y0 + Math.sin(t * q.sp + q.ph) * q.amp;
      octx.quadraticCurveTo(p.x, py, (p.x + q.x) / 2, (py + qy) / 2);
    }
    octx.lineTo(-4, edgeY(0));
    octx.closePath();
    octx.fill();

    // drips: a tapered column plus a bead at the tip, fused by the goo pass
    for (const d of drips) {
      const y0 = edgeY(d.x) - d.w * 0.4;
      const y1 = y0 + d.len;
      const wt = d.w * (d.fading ? Math.max(d.life, 0.2) : 1);
      const wb = wt * d.taper;
      const sx = Math.sin(t * d.sway + d.ph) * d.w * 0.35 * (d.len / (d.max + 1));

      octx.beginPath();
      octx.moveTo(d.x - wt / 2, y0);
      octx.lineTo(d.x + wt / 2, y0);
      octx.quadraticCurveTo(d.x + wt * 0.4 + sx, y1 - wb, d.x + wb / 2 + sx, y1);
      octx.lineTo(d.x - wb / 2 + sx, y1);
      octx.quadraticCurveTo(d.x - wt * 0.4 + sx, y1 - wb, d.x - wt / 2, y0);
      octx.closePath();
      octx.fill();

      octx.beginPath();
      octx.arc(d.x + sx, y1 - wb * 0.1, wb * 0.62, 0, Math.PI * 2);
      octx.fill();
    }

    // detached beads, stretched by their fall
    for (const p of drops) {
      const s = clamp(1 + p.vy / (H * 2.2), 1, 1.9);
      octx.beginPath();
      octx.ellipse(p.x, p.y, p.r / Math.sqrt(s), p.r * s, 0, 0, Math.PI * 2);
      octx.fill();
    }
  }

  function draw() {
    shapes();

    // goo: blur then crush the contrast so nearby masses merge into one body
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.filter = `blur(${6 * DPR}px) contrast(30)`;
    ctx.drawImage(off, 0, 0);
    ctx.filter = 'none';

    // the mask is white-on-black, so multiplying paints only the molten body
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // heat spilling into the dark
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.22;
    ctx.filter = `blur(${26 * DPR}px)`;
    ctx.drawImage(cv, 0, 0);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- lifecycle ---------- */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = off.width = Math.round(W * DPR);
    cv.height = off.height = Math.round(H * DPR);

    baseH = H * 0.22;
    grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#ff2a10');
    grad.addColorStop(0.18, '#e5000f');
    grad.addColorStop(0.55, '#c20009');
    grad.addColorStop(1, '#66000a');

    buildEdge();
    drips = [];
    drops = [];
    while (drips.length < targetDrips()) drips.push(newDrip());
    for (let i = 0; i < 420; i++) step(1 / 30);
    draw();
  }

  let prev = performance.now();
  function frame(now) {
    step(Math.min((now - prev) / 1000, 0.05));
    prev = now;
    draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();

  if (!reduced) {
    addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.on = true; });
    addEventListener('pointerleave', () => { pointer.on = false; });
    addEventListener('pointerdown', e => { drips.push(newDrip(e.clientX, true)); });
    requestAnimationFrame(frame);
  }
})();
</script>
